<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Libromundo{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
        }
        [data-bs-theme="dark"] {
            --bg-color: #212529;
            --text-color: #f8f9fa;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: none;
            transition: box-shadow 0.3s;
        }
        [data-bs-theme="dark"] .card {
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Navbar con toggle de tema -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Libromundo</a>
            <button class="btn btn-outline-secondary ms-auto" id="theme-toggle">
                <i class="bi bi-moon"></i> Tema Oscuro
            </button>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        // Toggle de tema oscuro
        document.getElementById('theme-toggle').addEventListener('click', function() {
            const html = document.documentElement;
            const icon = this.querySelector('i');
            if (html.getAttribute('data-bs-theme') === 'dark') {
                html.setAttribute('data-bs-theme', 'light');
                icon.className = 'bi bi-moon';
                this.innerHTML = '<i class="bi bi-moon"></i> Tema Oscuro';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-bs-theme', 'dark');
                icon.className = 'bi bi-sun';
                this.innerHTML = '<i class="bi bi-sun"></i> Tema Claro';
                localStorage.setItem('theme', 'dark');
            }
        });

        // Cargar tema guardado
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        if (savedTheme === 'dark') {
            document.getElementById('theme-toggle').innerHTML = '<i class="bi bi-sun"></i> Tema Claro';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
