services:
  db_libromundo:
    image: mysql:8.0
    container_name: db_libromundo
    environment:
      - MYSQL_DATABASE=libromundo
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web_libromundo:
    build: .
    container_name: web_libromundo
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db_libromundo
    environment:
      - DB_ENGINE=mysql
      - DB_HOST=db_libromundo
      - DB_NAME=libromundo
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_PORT=3306

volumes:
  mysql_data: